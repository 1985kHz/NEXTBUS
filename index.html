<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N2B22Z86KF"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-N2B22Z86KF');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXT BUS</title>
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <main class="shell">

    <header class="header">
      <div></div>
      <h1>NEXT BUS</h1>
      <button class="icon-btn" data-theme-toggle aria-label="テーマ切替">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </header>

    <div class="controls">
      <div class="controls-left">
        <div class="stop-wrap">
          <select id="stopSelect" aria-label="停留所"></select>
          <svg class="stop-caret" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 6 8 10 12 6"/>
          </svg>
        </div>
      </div>
      <div class="clock-center" id="clockDisplay"></div>
      <div class="controls-right">
        <div class="pill-toggle" role="group" aria-label="表示モード">
          <button type="button" data-mode="next" class="active">直近</button>
          <button type="button" data-mode="table">時刻表</button>
        </div>
        <div class="pill-toggle" role="group" aria-label="ダイヤ種別">
          <button type="button" data-day="weekday" class="active">平日</button>
          <button type="button" data-day="holiday">休日</button>
        </div>
      </div>
    </div>

    <div class="body">

      <section id="nextSection">
        <div class="next-card">
          <div class="next-grid" id="nextWrap"></div>
          <div class="fixed-note">① ② = のりば</div>
        </div>
      </section>

      <section id="tableSection" hidden>
        <div class="tl-panel">
          <div class="tl-head">
            <span class="tl-title" id="tableTitle">時刻表</span>
          </div>
          <div class="tl-scroll">
            <div id="timeline" class="tl"></div>
          </div>
          <div class="legend">
            <div class="legend-row">
              <span><span class="legend-dot" style="background:var(--primary)"></span>次の便</span>
            </div>
            <div class="legend-row">
              <span>病院 = 横須賀市民病院</span>
              <span>通研 = 通信研究所</span>
              <span>丘2番 = 光の丘2番</span>
            </div>
            <div class="legend-row">
              <span>① ② = のりば</span>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
